<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="h5 mb-2">{{ app_title }}</h1>
              <div class="text-muted mb-4">
                ファイル: <code>{{ filename }}</code>
              </div>

              <form action="/analyze" method="post" class="row g-3">
                <input type="hidden" name="analysis_id" value="{{ analysis_id }}" />

                <div class="col-md-6">
                  <label class="form-label">TWA列（必須）</label>
                  <select class="form-select" name="col_twa" required>
                    {% for c in columns %}
                      <option value="{{ c }}" {% if suggestions.twa_deg == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                  </select>
                  <div class="form-text">-180..180 または 0..360 のどちらでもOK（自動で -180..180 に正規化します）</div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">AWA列（任意：TWAが0..180の時に符号付けに使用）</label>
                  <select class="form-select" name="col_awa">
                    <option value="" selected>（使わない）</option>
                    {% for c in columns %}
                      <option value="{{ c }}" {% if suggestions.awa_deg == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                  </select>
                  <div class="form-text">TWAが符号なしの場合、AWAの符号（Port/Starboard）でTWAに±を付けます。</div>
                </div>

                <div class="col-md-3">
                  <label class="form-label">|TWA| 最小 (deg)</label>
                  <input class="form-control" type="number" step="1" name="abs_twa_min" value="25" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">|TWA| 最大 (deg)</label>
                  <input class="form-control" type="number" step="1" name="abs_twa_max" value="175" />
                </div>

                <div class="col-md-3">
                  <label class="form-label">ビン幅 (deg)</label>
                  <input class="form-control" type="number" step="0.5" name="bin_size_deg" value="2" />
                </div>

                <div class="col-md-3">
                  <label class="form-label">最小サンプル数/片舷</label>
                  <input class="form-control" type="number" step="1" name="min_points_per_side" value="50" />
                </div>

                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-primary" type="submit">解析</button>
                  <a class="btn btn-outline-secondary" href="/">戻る</a>
                </div>
              </form>

              <hr class="my-4" />
              <details>
                <summary class="small text-muted">ログの列一覧（参考）</summary>
                <div class="mt-2 small">
                  {% for c in columns %}
                    <code class="me-2">{{ c }}</code>
                  {% endfor %}
                </div>
              </details>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
