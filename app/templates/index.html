<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="h4 mb-3">{{ app_title }}</h1>
              <p class="text-muted mb-4">
                Expeditionのログ（CSV/TSV等）をアップロードして、左右対称性からTWAのオフセット補正テーブル（CSV）を推定します。
              </p>

              <form action="/upload" method="post" enctype="multipart/form-data" class="d-flex gap-2 align-items-center">
                <input class="form-control" type="file" name="log_file" accept=".csv,.txt,.tsv" required />
                <button class="btn btn-primary" type="submit">アップロード</button>
              </form>

              <hr class="my-4" />
              <div class="small text-muted">
                注意: 現在の推定は「TWA誤差が両舷で同符号に入る（加法バイアス）」という仮定のMVPです。
                次段階でPolarとのフィット（スケール/非線形）にも対応できます。
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
